name: Project Mittens CI Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Mandatory Verification Pipeline (Section 7.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: 1. Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following Go files are not canonically formatted:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -s -w .' to fix."
            exit 1
          fi

      - name: 2. Run Go Vet
        run: go vet ./...

      - name: 3. Run Staticcheck (Static Analysis)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.5.1
          staticcheck ./...

      - name: 4. Run Govulncheck (Vulnerability Scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...

      - name: 5. Run Test Suite with Race Detector
        run: go test -race -v ./...

      - name: 6. Build All Packages and Executable Binary
        run: |
          go build -v ./...
          go build -o /tmp/mittens-opt cmd/optimizer/main.go
