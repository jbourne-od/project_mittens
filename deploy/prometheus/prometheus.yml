global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'mittens-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mittens-api:8080']
        labels:
          app: 'project-mittens'
          tier: 'optimizer-engine'

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mittens-otel-collector:8889']
        labels:
          app: 'otel-collector'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
